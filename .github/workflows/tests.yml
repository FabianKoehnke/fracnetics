name: Run Tests
on: [push, pull_request]

jobs:
  python-tests:
    runs-on: ubuntu-latest
    # A hanging test used to run into GitHub's 6 h limit without a trace
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        python-version: [3.10.13, 3.11]

    steps:
    - uses: actions/checkout@v3
      with:
        submodules: true
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install .
        # box2d-py builds from source and needs swig before gymnasium[box2d]
        pip install swig
        pip install -r tests/requirements.txt
    - name: Run tests
      # -v: one line per test; faulthandler dumps every thread's stack if a test hangs > 5 min
      env:
        PYTHONUNBUFFERED: "1"
      run: python -m pytest tests/ -v -o faulthandler_timeout=300

